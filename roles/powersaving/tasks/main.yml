---
# Powersaving:
#   * tlp (installed + enabled, default config)
#   * kiosk-inhibit daemon: inhibitor-aware idle manager for the 3-TTY
#     cage kiosk.
#       - Screen off: disables the foreground cage's output (wlr-randr
#         --off) while every cage is idle and no inhibitor cookie is
#         held, re-enables it on the first input. (cage has no
#         wlr-output-power-management-v1, so wlopm cannot be used;
#         --off/--on on the output is safe for cage — verified.)
#         The foreground output is detected from wlr-randr's header
#         line (>= 0.4 no longer prints '(connected)'), and its actual
#         Enabled state is reconciled every tick so VT switches cannot
#         leave us out of sync.
#       - Suspend: holds a logind INHIBIT_IDLE lock (block mode) while
#         any cage is active (input or zwp inhibitor via
#         ext_idle_notify_v1) or any app holds a cookie (classic D-Bus
#         ScreenSaver/SessionManager/PowerManagement, XDG portal); when
#         the lock is released, logind IdleAction=suspend
#         (powersaving_suspend) does the suspend through sleep.target /
#         systemd-sleep, so the Hue power-cycle hooks fire.
#         Releasing the last D-Bus cookie starts a fresh
#         screen_off_after grace period: those inhibitors are invisible
#         to cage, whose idle state would otherwise be stale and blank
#         the screen immediately.
#         NB: suspend can hang if Kodi holds open NFS handles.
#
# The daemon itself is a fixed script (files/kiosk-inhibit.py); its
# tunables are rendered into /etc/kiosk-inhibit.conf.

- name: Powersaving packages
  ansible.builtin.apt:
    name: tlp
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: tlp enabled and running
  ansible.builtin.systemd:
    name: tlp
    enabled: true
    state: started

- name: logind drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Name this 99-* so it wins over any earlier drop-in (10-*, 50-*, ...).
# Drop-ins are merged in filename order, so a stray 99 file from a manual
# override is itself replaced by this one and suspend_after takes effect.
- name: logind idle action drop-in
  ansible.builtin.template:
    src: logind-idle.conf.j2
    dest: /etc/systemd/logind.conf.d/99-kiosk-idle.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd-logind

# Pre-99 deployments used 10-kiosk-idle.conf; drop it so there is a
# single source of truth for IdleAction/IdleActionSec.
- name: remove legacy logind idle drop-in
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d/10-kiosk-idle.conf
    state: absent
  notify: reload systemd-logind

- name: kiosk-inhibit daemon
  ansible.builtin.copy:
    src: kiosk-inhibit.py
    dest: /usr/local/bin/kiosk-inhibit
    owner: root
    group: root
    mode: "0755"
  notify: restart kiosk-inhibit

- name: kiosk-inhibit configuration
  ansible.builtin.template:
    src: kiosk-inhibit.conf.j2
    dest: "{{ kiosk_inhibit_config_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart kiosk-inhibit

- name: kiosk-inhibit unit
  ansible.builtin.template:
    src: kiosk-inhibit.service.j2
    dest: /etc/systemd/system/kiosk-inhibit.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart kiosk-inhibit

- name: legacy kiosk-idle-off unit present?
  ansible.builtin.stat:
    path: /etc/systemd/system/kiosk-idle-off.service
  register: legacy_idle_off

- name: stop and disable legacy kiosk-idle-off
  ansible.builtin.systemd:
    name: kiosk-idle-off
    state: stopped
    enabled: no
  when: legacy_idle_off.stat.exists
  notify: reload systemd

- name: remove legacy kiosk-idle-off files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/kiosk-idle-off.sh
    - /etc/systemd/system/kiosk-idle-off.service
  notify: reload systemd

- name: kiosk-inhibit daemon enabled and running
  ansible.builtin.systemd:
    name: kiosk-inhibit
    enabled: true
    state: started
