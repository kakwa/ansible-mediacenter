---
# Powersaving:
#   * tlp (installed + enabled, default config)
#   * kiosk-inhibit daemon: inhibitor-aware idle manager for the 3-TTY
#     cage kiosk.
#       - Screen off: disables the foreground cage's output (wlr-randr
#         --off) while every cage is idle and no inhibitor cookie is
#         held, re-enables it on the first input. (cage has no
#         wlr-output-power-management-v1, so wlopm cannot be used;
#         --off/--on on the output is safe for cage — verified.)
#       - Suspend: holds a logind INHIBIT_IDLE lock (block mode) while
#         any cage is active (input or zwp inhibitor via
#         ext_idle_notify_v1) or any app holds a cookie (classic D-Bus
#         ScreenSaver/SessionManager/PowerManagement, XDG portal); when
#         the lock is released, logind IdleAction=suspend
#         (powersaving_suspend) does the suspend through sleep.target /
#         systemd-sleep, so the Hue power-cycle hooks fire.
#         NB: suspend can hang if Kodi holds open NFS handles.

- name: Powersaving packages
  ansible.builtin.apt:
    name: tlp
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: tlp enabled and running
  ansible.builtin.systemd:
    name: tlp
    enabled: true
    state: started

- name: logind drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: logind idle action drop-in
  ansible.builtin.template:
    src: logind-idle.conf.j2
    dest: /etc/systemd/logind.conf.d/10-kiosk-idle.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd-logind

- name: kiosk-inhibit daemon
  ansible.builtin.template:
    src: kiosk-inhibit.py.j2
    dest: /usr/local/bin/kiosk-inhibit
    owner: root
    group: root
    mode: "0755"
  notify: restart kiosk-inhibit

- name: kiosk-inhibit unit
  ansible.builtin.template:
    src: kiosk-inhibit.service.j2
    dest: /etc/systemd/system/kiosk-inhibit.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart kiosk-inhibit

- name: legacy kiosk-idle-off unit present?
  ansible.builtin.stat:
    path: /etc/systemd/system/kiosk-idle-off.service
  register: legacy_idle_off

- name: stop and disable legacy kiosk-idle-off
  ansible.builtin.systemd:
    name: kiosk-idle-off
    state: stopped
    enabled: no
  when: legacy_idle_off.stat.exists
  notify: reload systemd

- name: remove legacy kiosk-idle-off files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/kiosk-idle-off.sh
    - /etc/systemd/system/kiosk-idle-off.service
  notify: reload systemd

- name: kiosk-inhibit daemon enabled and running
  ansible.builtin.systemd:
    name: kiosk-inhibit
    enabled: true
    state: started
