---
- name: Install packages for hue-plugs
  ansible.builtin.apt:
    name: "{{ hue_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: hue_plugs_enable
  become: true

- name: Deploy hue-plugs CLI script
  ansible.builtin.copy:
    src: hue-plugs.py
    dest: "{{ hue_script_path }}"
    owner: root
    group: root
    mode: '0755'
  when: hue_plugs_enable
  become: true
  tags: [hue-plugs-script]

- name: Create system-sleep hook directory
  ansible.builtin.file:
    path: "{{ hue_sleep_hook | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: hue_plugs_enable
  become: true
  tags: [hue-plugs-sleep]

- name: Deploy hue-plugs system-sleep hook
  ansible.builtin.template:
    src: hue-plugs.sleep.j2
    dest: "{{ hue_sleep_hook }}"
    owner: root
    group: root
    mode: '0755'
  when: hue_plugs_enable
  become: true
  tags: [hue-plugs-sleep]

# Older revisions deployed the hook to /etc/systemd/system-sleep, which
# systemd-sleep never executes. Remove the stale copy.
- name: Remove legacy hue-plugs system-sleep hook
  ansible.builtin.file:
    path: /etc/systemd/system-sleep/hue-plugs
    state: absent
  when: hue_plugs_enable
  become: true
  tags: [hue-plugs-sleep]

- name: Deploy hue-plugs boot/shutdown wrapper
  ansible.builtin.template:
    src: hue-plugs-power.sh.j2
    dest: "{{ hue_power_script }}"
    owner: root
    group: root
    mode: '0755'
  when: hue_plugs_enable
  become: true
  tags: [hue-plugs-power]

- name: Deploy hue-plugs boot/shutdown unit
  ansible.builtin.template:
    src: hue-plugs-power.service.j2
    dest: "{{ hue_power_unit }}"
    owner: root
    group: root
    mode: '0644'
  when: hue_plugs_enable
  become: true
  tags: [hue-plugs-power]

# RemainAfterExit keeps the oneshot unit active after boot, so its
# ExecStop runs while the network is still up at shutdown. If the unit is
# already active Ansible leaves it alone (starting it again would power
# the plug off and on via ExecStop/ExecStart).
- name: Enable and start hue-plugs boot/shutdown unit
  ansible.builtin.systemd:
    name: "{{ hue_power_service }}"
    enabled: true
    state: started
    daemon_reload: true
  when: hue_plugs_enable
  become: true
  tags: [hue-plugs-power]

- name: Check hue-plugs configuration
  ansible.builtin.assert:
    that:
      - hue_bridge_ip | length > 0
      - hue_client_key | length > 0
      - hue_plugs | length > 0
    fail_msg: >-
      hue_bridge_ip, hue_client_key and hue_plugs must all be set for the
      role to manage the config file. Pair manually first (see the pairing
      instructions printed when credentials are empty), then set
      hue_bridge_ip and hue_client_key (e.g. from vault) and hue_plugs to
      the list of {id, name} entries. Alternatively set
      hue_plugs_enable: false to skip this role.
    quiet: true
  when:
    - hue_plugs_enable
    - hue_bridge_ip | length > 0 or hue_client_key | length > 0

- name: Deploy hue-plugs config file
  ansible.builtin.template:
    src: hue-plugs.conf.j2
    dest: "{{ hue_config_file }}"
    owner: root
    group: root
    mode: '0600'
  when:
    - hue_plugs_enable
    - hue_bridge_ip | length > 0
    - hue_client_key | length > 0

- name: Print hue-plugs pairing instructions
  ansible.builtin.debug:
    msg:
      - "hue-plugs: no bridge credentials set -- the config file was left untouched."
      - "Pair manually on the box (run separately, not from Ansible):"
      - "  1. {{ hue_script_path }} setup"
      - "     (press the link button on the Hue bridge when prompted;"
      - "      bridge IP + client key are written to {{ hue_config_file }})"
      - "  2. {{ hue_script_path }} autofill"
      - "     (discovers the plugs and writes them to {{ hue_config_file }})"
      - "  3. {{ hue_script_path }} list   # sanity check"
      - "Once the bridge IP and client key (printed by setup) are recorded"
      - "in the playbook (hue_bridge_ip / hue_client_key, e.g. via vault)"
      - "and hue_plugs is filled in, re-run the playbook: Ansible then"
      - "manages {{ hue_config_file }} itself. The suspend/resume and"
      - "boot/shutdown hooks stay dormant until {{ hue_config_file }} exists."
  when:
    - hue_plugs_enable
    - hue_bridge_ip | length == 0 or hue_client_key | length == 0
