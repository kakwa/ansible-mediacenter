---
# Boot splash (plymouth) + grub tidy-up.
- name: Set default plymouth theme
  ansible.builtin.copy:
    dest: /etc/plymouth/plymouthd.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Administrator customizations go in this file
      [Daemon]
      Theme={{ plymouth_theme }}
      ShowDelay=0
  notify: update grub

- name: Grub quiet splash, drop installer initrd leftover
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - regexp: "^GRUB_CMDLINE_LINUX_DEFAULT="
      line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"'
    - regexp: "^GRUB_CMDLINE_LINUX="
      line: 'GRUB_CMDLINE_LINUX=""'
  notify: update grub

- name: update-grub is available
  ansible.builtin.apt:
    name: grub-pc
    state: present
    update_cache: true
    cache_valid_time: 3600
