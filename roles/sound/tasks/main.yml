---
# PipeWire sound server (with the PulseAudio compatibility layer for
# kodi/firefox) and WirePlumber as the session manager.
# The preferred output is pinned via a node priority rule, so the USB
# Sound Blaster stays the default sink even if another card appears.

- name: Sound packages
  ansible.builtin.apt:
    name:
      - pipewire
      - pipewire-pulse
      - wireplumber
    state: present
    update_cache: true
    cache_valid_time: 3600

# Linger keeps the kiosk user's user manager (and thus the user-session
# services such as wireplumber) alive from boot, so that user-level
# handlers work at any time.
- name: Linger state of the kiosk user
  ansible.builtin.command: loginctl show-user {{ kodi_user }} --property=Linger
  register: linger
  changed_when: false
  failed_when: false

- name: Enable linger for the kiosk user
  ansible.builtin.command: loginctl enable-linger {{ kodi_user }}
  when: "'Linger=no' in (linger.stdout | default('Linger=no'))"
  changed_when: true

- name: WirePlumber drop-in directory
  ansible.builtin.file:
    path: /etc/wireplumber/wireplumber.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Preferred default sink (wireplumber node priority)
  ansible.builtin.template:
    src: wireplumber-default-sink.conf.j2
    dest: /etc/wireplumber/wireplumber.conf.d/50-kodi-default-sink.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart wireplumber
