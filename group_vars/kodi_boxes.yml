---
# Target box identity
kodi_box_name: kodi            # hostname + avahi name (kodi.local)
kodi_user: kakwa
kodi_user_uid: 1001
kodi_home: /var/lib/xbmc       # actual home of kakwa on the box

# Media
nfs_media_host: nas.kakwa.fr   # 192.168.1.3
nfs_media_export: /volume1/shared/
nfs_media_mount: /home/nfs
# Kodi video/music/pictures sources, generated into sources.xml.
# Extend as the library layout dictates.
kodi_media_roots:
  video:
    - { name: films, path: /home/nfs/films }
    - { name: series, path: /home/nfs/series }
    - { name: music, path: /home/nfs/music }
    - { name: animes, path: /home/nfs/animes }
    - { name: documentaires, path: /home/nfs/documentaires }
  music:
    - { name: music, path: /home/nfs/music }
    - { name: nfs, path: /home/nfs }
  pictures:
    - { name: photos, path: /home/nfs/photos }

# Kiosk layout: one cage per TTY. Alt+F<n> switches between them.
#   prestop: run before cage starts (and again on stop) to reap a stale
#            instance of the app from a previous boot/VT session.
#            killall matches the process name; the [f]irefox bracket
#            trick keeps pkill -f from matching its own wrapper cmdline.
#   scale:   optional compositor-level UI scale (wlr-randr) for this TTY.
#            Omitted where it would be wrong or unwanted (kodi stays 1.0).
#            cage-run.sh re-applies it after every VT switch, because
#            wlroots destroys the output when the VT is lost.
kiosk_tys:
  - tty: 1
    name: kodi
    app: /usr/local/bin/cage-kodi
    prestop: killall -9 kodi.bin kodi-standalone 2>/dev/null; true
  - tty: 2
    name: web
    app: /usr/local/bin/cage-web
    scale: 2
    prestop: pkill -9 -u {{ kodi_user }} -f "[f]irefox-esr.*kiosk-web" 2>/dev/null; true
  - tty: 3
    name: spotify
    app: /usr/local/bin/cage-spotify
    scale: 2
    prestop: pkill -9 -u {{ kodi_user }} -f "[f]irefox-esr.*kiosk-spotify" 2>/dev/null; true

# Box-specific browser URLs.
kiosk_browser:
  web_url: https://duckduckgo.com
  spotify_url: https://open.spotify.com

# Kodi
kodi_packages:
  - kodi
  - kodi-inputstream-adaptive
  - kodi-inputstream-ffmpegdirect
  - kodi-inputstream-rtmp

# Sound
sound_server: pipewire
# Preferred output, as a regex matched against the pipewire node name
# (full node name is alsa_output.<regex>). The USB Sound Blaster HD on
# this box is alsa_output.usb-Creative_Technology_USB_Sound_Blaster_HD_*.
default_audio_device: usb-.*
# WirePlumber picks the default sink by priority.session; default sinks
# sit around 600-1100. Keep below 1500 (see the wireplumber docs).
default_audio_priority: 1200

# Hue smart plugs (role: hue-plugs)
# The box suspends/restarts the "PlugHifi" plug on system sleep:
#   pre suspend  -> stop   (device loses power while the box sleeps)
#   post resume  -> restart (off, wait hue_restart_delay, on)
# hue_suspend_plug: "PlugHifi"   # already the default
# First deploy without credentials (the role prints pairing instructions);
# after `hue-plugs.py setup --save` + `autofill --save` on the box, fill in:
# hue_bridge_ip: "192.168.1.x"
# hue_client_key: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# hue_plugs:
#   - { id: "1", name: "PlugHifi" }
# and re-run the playbook so Ansible manages /etc/hue-plugs.conf.

# Power
screen_off_after: 30      # seconds idle -> screen off
suspend_after: 60         # seconds idle -> system suspend
# NB: suspend can hang if Kodi holds open NFS handles; set
# powersaving_suspend: false to disable it.
powersaving_suspend: true

# Boot
plymouth_theme: spinfinity
