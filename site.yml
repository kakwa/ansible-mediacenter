---
- name: Kodi media box (192.168.1.6)
  hosts: kodi_boxes
  become: true
  roles:
    - base        # hostname, user groups, essential packages
    - kodi        # kodi + inputstreams, media sources, settings
    - kiosk       # 3x cage: tty1 kodi / tty2 browser / tty3 spotify
    - sound       # pipewire sound server, default output
    - avahi       # kodi.local
    - plymouth    # boot splash + grub
    - powersaving # idle screen-off / suspend, tlp
    - nfs         # NAS media mount
    - hue-plugs   # Hue smart plug CLI + stop-on-suspend / restart-on-resume hook
